name: API Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: workorder_app
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: work_orders_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workorder_app -d work_orders_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://workorder_app:test_password@localhost:5432/work_orders_test
      JWT_SECRET_KEY: github-actions-test-secret
      ACCESS_TOKEN_EXPIRE_MINUTES: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
        
      - name: Install project
        run: pip install -e ".[dev]"
        
      - name: Run database migrations
        run: alembic upgrade head
        
      - name: Run test suite
        run: pytest -v
